# Server
server.port=8080

# SQLite file database (created in the project folder, persists after restart)
spring.datasource.url=jdbc:sqlite:placement_tracker.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# JPA / Hibernate: auto-create/update tables, speak SQLite SQL
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Thymeleaf: don't cache templates while developing (edit HTML, just refresh)
spring.thymeleaf.cache=false
