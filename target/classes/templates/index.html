<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{base :: head('Dashboard')}"></head>
<body>
<nav th:replace="~{base :: nav}"></nav>

<main class="container">
    <div class="page-head">
        <h1>My Applications</h1>
        <a th:href="@{/applications/new}" class="btn btn-primary">+ Add Application</a>
    </div>

    <!-- Empty state when there are no applications -->
    <div th:if="${#lists.isEmpty(applications)}" class="empty">
        <p class="empty-title">No applications yet.</p>
        <p>Start tracking your placements — add your first application.</p>
        <a th:href="@{/applications/new}" class="btn btn-primary">Add your first application</a>
    </div>

    <!-- Dashboard table -->
    <table th:if="${!#lists.isEmpty(applications)}" class="table">
        <thead>
        <tr>
            <th>Company</th>
            <th>Role</th>
            <th>Status</th>
            <th>Applied Date</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="app : ${applications}">
            <td th:text="${app.company}">Acme Labs</td>
            <td th:text="${app.role}">Python Intern</td>
            <td>
                <span th:text="${app.status}"
                      th:class="'badge badge-' + ${#strings.toLowerCase(app.status)}">Applied</span>
            </td>
            <td th:text="${app.appliedOn != null ? app.appliedOn : '—'}">2026-09-16</td>
            <td class="actions">
                <a th:href="@{/applications/{id}(id=${app.id})}" class="btn btn-small">View</a>
                <a th:href="@{/applications/{id}/edit(id=${app.id})}" class="btn btn-small btn-secondary">Edit</a>
            </td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
