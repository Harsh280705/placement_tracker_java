<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{base :: head(${formTitle})}"></head>
<body>
<nav th:replace="~{base :: nav}"></nav>

<main class="container narrow">
    <h1 th:text="${formTitle}">Add Application</h1>

    <!-- Reused for CREATE and EDIT: controller sets formTitle + formAction + application -->
    <form th:object="${jobApplication}" th:action="@{${formAction}}" method="post" class="form">
        <div class="field">
            <label for="company">Company *</label>
            <input id="company" type="text" th:field="*{company}" placeholder="e.g. Acme Labs"/>
            <p th:if="${#fields.hasErrors('company')}" th:errors="*{company}" class="error"></p>
        </div>

        <div class="field">
            <label for="role">Role *</label>
            <input id="role" type="text" th:field="*{role}" placeholder="e.g. Backend Intern"/>
            <p th:if="${#fields.hasErrors('role')}" th:errors="*{role}" class="error"></p>
        </div>

        <div class="field">
            <label for="status">Status *</label>
            <select id="status" th:field="*{status}">
                <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}">Applied</option>
            </select>
            <p th:if="${#fields.hasErrors('status')}" th:errors="*{status}" class="error"></p>
        </div>

        <div class="field">
            <label for="appliedOn">Applied Date (required unless Wishlist)</label>
            <input id="appliedOn" type="date" th:field="*{appliedOn}"/>
            <p th:if="${#fields.hasErrors('appliedOn')}" th:errors="*{appliedOn}" class="error"></p>
        </div>

        <div class="field">
            <label for="jobUrl">Job URL (optional)</label>
            <input id="jobUrl" type="url" th:field="*{jobUrl}" placeholder="https://..."/>
            <p th:if="${#fields.hasErrors('jobUrl')}" th:errors="*{jobUrl}" class="error"></p>
        </div>

        <div class="field">
            <label for="notes">Notes (optional, max 1000 chars)</label>
            <textarea id="notes" rows="4" th:field="*{notes}" placeholder="Interview prep, contacts, ..."></textarea>
            <p th:if="${#fields.hasErrors('notes')}" th:errors="*{notes}" class="error"></p>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save</button>
            <a th:href="@{/}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</main>
</body>
</html>
